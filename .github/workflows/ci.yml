name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Frontend CI (React + Vite)
  # Steps: install → lint → build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./services/frontend
        run: npm ci

      - name: Lint
        working-directory: ./services/frontend
        run: npm run lint

      - name: Build
        working-directory: ./services/frontend
        run: npm run build

  # ─────────────────────────────────────────────
  # Job 2: Admin CI (React + Vite)
  # Steps: install → lint → build
  # ─────────────────────────────────────────────
  admin:
    name: Admin CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/admin/package-lock.json

      - name: Install dependencies
        working-directory: ./services/admin
        run: npm ci

      - name: Lint
        working-directory: ./services/admin
        run: npm run lint

      - name: Build
        working-directory: ./services/admin
        run: npm run build

  # ─────────────────────────────────────────────
  # Job 3: Backend Services CI (Node.js/Express)
  # Matrix strategy: one job per backend service
  # Step: npm ci only (no test files exist yet)
  # ─────────────────────────────────────────────
  backend:
    name: Backend CI - ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - catalog
          - user-auth
          - order-payment
          - fulfillment
          - inventory
          - shopping
          - platform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies (${{ matrix.service }})
        working-directory: ./services/${{ matrix.service }}
        run: npm ci

      - name: Run Jest tests
        if: matrix.service == 'user-auth'
        working-directory: ./services/${{ matrix.service }}
        run: npm test -- --runInBand

  # ─────────────────────────────────────────────
  # Job 4: Docker Build — user-auth
  # Proves the Dockerfile builds successfully.
  # Image is tagged with the Git commit SHA.
  # Image is NOT pushed to any registry yet.
  # ─────────────────────────────────────────────
  docker-build-user-auth:
    name: Docker Build - user-auth
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./services/user-auth
          file: ./services/user-auth/Dockerfile
          push: false
          tags: user-auth:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
